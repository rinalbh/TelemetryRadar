<svg xmlns="http://www.w3.org/2000/svg" width="1586" height="992" viewBox="0 0 1586 992">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#EDF6FF"/>
      <stop offset="1" stop-color="#AACCEE"/>
    </linearGradient>
  </defs>

  <rect width="1586" height="992" fill="url(#bg)"/>

  <g transform="translate(68 62)" fill="none" stroke="#3478FF" stroke-linecap="round">
    <circle r="18" stroke-width="2.4"/>
    <circle r="11.5" stroke-width="2" opacity="0.55"/>
    <circle r="5.5" stroke-width="2" opacity="0.85"/>
    <path d="M0 0 L0 -18 A18 18 0 0 1 12.7 -12.7 Z" fill="#3478FF" stroke="none" opacity="0.22"/>
    <path d="M0 0 L12.6 -12.6" stroke-width="2"/>
    <circle r="2.2" fill="#3478FF" stroke="none"/>
    <circle cx="8" cy="-4.5" r="2" fill="#3478FF" stroke="none"/>
  </g>
  <text x="102" y="78" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#151B36">Discord analyst</text>

  <rect x="48" y="148" width="1040" height="792" rx="28" fill="#FFFFFF"/>
  <rect x="1112" y="148" width="426" height="792" rx="28" fill="#FFFFFF"/>

  <rect x="80" y="180" width="40" height="40" rx="12" fill="#3478FF"/>
  <path d="M92 194 h16 a3 3 0 0 1 3 3 v8 a3 3 0 0 1-3 3 h-8 l-4 4 v-4 h-4 a3 3 0 0 1-3-3 v-8 a3 3 0 0 1 3-3 z" fill="#FFFFFF"/>
  <text x="136" y="198" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#151B36">Discord analyst</text>
  <text x="136" y="220" font-family="Arial, sans-serif" font-size="14" fill="#617193">Working on Discord, 48.0 MB</text>
  <rect x="900" y="184" width="148" height="32" rx="16" fill="#E7F8F4"/>
  <circle cx="922" cy="200" r="5" fill="#00C5D7"/>
  <text x="936" y="206" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0E8A72">Working</text>

  <g font-family="Arial, sans-serif" font-size="16" fill="#455986">
    <text x="80" y="286" fill="#8B98B0" font-size="14">14:44:02</text>
    <text x="180" y="286">Opened the Discord capture. One session, 48.0 MB.</text>
    <path d="M80 308 H1048" stroke="#E3ECF8" stroke-width="1"/>

    <text x="80" y="346" fill="#8B98B0" font-size="14">14:44:09</text>
    <text x="180" y="346">Split the stream. Upload 21.4 MB, download 26.6 MB.</text>
    <path d="M80 368 H1048" stroke="#E3ECF8" stroke-width="1"/>

    <text x="80" y="406" fill="#8B98B0" font-size="14">14:44:18</text>
    <text x="180" y="406">Grouping packets: messages, voice, video, media, location.</text>
    <path d="M80 428 H1048" stroke="#E3ECF8" stroke-width="1"/>

    <text x="80" y="466" fill="#8B98B0" font-size="14">14:44:27</text>
    <text x="180" y="466">Messages look like normal chat. Largest share, 41%.</text>
    <path d="M80 488 H1048" stroke="#E3ECF8" stroke-width="1"/>

    <text x="80" y="526" fill="#8B98B0" font-size="14">14:44:36</text>
    <text x="180" y="526">Voice and video look like a call, not a hidden stream.</text>
    <path d="M80 548 H1048" stroke="#E3ECF8" stroke-width="1"/>

    <text x="80" y="586" fill="#8B98B0" font-size="14">14:44:44</text>
    <text x="180" y="586">Media is files and stickers someone chose to send. 8%.</text>
    <path d="M80 608 H1048" stroke="#E3ECF8" stroke-width="1"/>

    <text x="80" y="646" fill="#8B98B0" font-size="14">14:44:52</text>
    <text x="180" y="646" fill="#151B36" font-weight="700">Location is in here. GPS, IP region, device locale.</text>
    <path d="M80 668 H1048" stroke="#E3ECF8" stroke-width="1"/>

    <text x="80" y="706" fill="#8B98B0" font-size="14">14:45:01</text>
    <text x="180" y="706" fill="#D14343">I would not leak this. A precise point can show home, work, or a route.</text>
    <path d="M80 728 H1048" stroke="#E3ECF8" stroke-width="1"/>

    <text x="80" y="766" fill="#3478FF" font-size="14">14:45:06</text>
    <text x="180" y="766" fill="#3478FF">Opening the packet profile</text>
    <rect x="418" y="752" width="8" height="16" rx="1" fill="#3478FF"/>
  </g>

  <text x="80" y="850" font-family="Arial, sans-serif" font-size="14" fill="#8B98B0">8 of 9 notes</text>
  <rect x="80" y="868" width="968" height="10" rx="5" fill="#E9F0FA"/>
  <rect x="80" y="868" width="860" height="10" rx="5" fill="#3478FF"/>

  <!-- Side status -->
  <text x="1148" y="196" font-family="Arial, sans-serif" font-size="13" fill="#8B98B0">APP</text>
  <text x="1148" y="234" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#151B36">Discord</text>
  <text x="1148" y="266" font-family="Arial, sans-serif" font-size="16" fill="#617193">Capture closed, 48.0 MB</text>

  <path d="M1148 300 H1474" fill="none" stroke="#E3ECF8" stroke-width="1"/>

  <text x="1148" y="344" font-family="Arial, sans-serif" font-size="13" fill="#8B98B0">NOTED SO FAR</text>

  <g font-family="Arial, sans-serif" font-size="16">
    <rect x="1148" y="368" width="12" height="12" rx="6" fill="#3478FF"/>
    <text x="1172" y="380" fill="#151B36">Messages</text>
    <text x="1474" y="380" text-anchor="end" fill="#74809C">41%</text>

    <rect x="1148" y="408" width="12" height="12" rx="6" fill="#00C5D7"/>
    <text x="1172" y="420" fill="#151B36">Voice call</text>
    <text x="1474" y="420" text-anchor="end" fill="#74809C">26%</text>

    <rect x="1148" y="448" width="12" height="12" rx="6" fill="#3D8BFF"/>
    <text x="1172" y="460" fill="#151B36">Video</text>
    <text x="1474" y="460" text-anchor="end" fill="#74809C">19%</text>

    <rect x="1148" y="488" width="12" height="12" rx="6" fill="#A9CBFF"/>
    <text x="1172" y="500" fill="#151B36">Media</text>
    <text x="1474" y="500" text-anchor="end" fill="#74809C">8%</text>

    <rect x="1148" y="528" width="12" height="12" rx="6" fill="#FF5A6C"/>
    <text x="1172" y="540" fill="#151B36">Location</text>
    <text x="1474" y="540" text-anchor="end" font-weight="700" fill="#D14343">6%</text>
  </g>

  <rect x="1148" y="590" width="326" height="88" rx="16" fill="#FFF1F3"/>
  <text x="1172" y="624" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#D14343">Do not leak location</text>
  <text x="1172" y="650" font-family="Arial, sans-serif" font-size="14" fill="#8A3A44">The profile opens with that warning.</text>
</svg>
