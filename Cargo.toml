[package]
name = "telemetryradar"
version = "0.1.0"
edition = "2024"
default-run = "telemetryradar"
description = "System traffic capture, temporary MITM, and desktop investigation tools"
repository = "https://github.com/rinalbh/TelemetryRadar"
publish = false

[workspace]
members = ["src-tauri"]
default-members = ["."]
resolver = "3"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[features]
test-support = ["agent-client-protocol/stdio"]

[[bin]]
name = "opencode-test-agent"
path = "tests/support/opencode_agent.rs"
required-features = ["test-support"]
test = false

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = "3.5.2"
sysinfo = "0.39.6"
tempfile = "3.27.0"
thiserror = "2.0.21"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
same-file = "1.0.6"
which = "8.0.6"
semver = "1.0.28"
command-group = "5.0.1"
directories = "6.0.0"
fs2 = "0.4.3"
pem = "4.0.0"
sha2 = "0.11.1"
hex = "0.4.3"
pcap-parser = "0.17.0"
agent-client-protocol = { version = "3.5.0", features = ["process"] }
tokio.workspace = true
futures = "0.3.34"
async-process = "2.5.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
schannel = "0.1.30"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Threading"] }
